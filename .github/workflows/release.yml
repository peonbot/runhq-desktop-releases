name: Desktop Release

# Builds the RunHQ desktop app on FREE public-repo runners by checking out the
# private peonbot/RunHQ source, then publishes a draft GitHub Release (installers
# + signed latest.json) to THIS public repo. The private source is only ever
# pulled into the ephemeral runner — it is never committed here.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version / tag, e.g. v0.0.2'
        required: true
      source_ref:
        description: 'peonbot/RunHQ ref to build (branch, tag, or SHA)'
        required: false
        default: master
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Check out private RunHQ source
        uses: actions/checkout@v4
        with:
          repository: peonbot/RunHQ
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          ref: ${{ github.event.inputs.source_ref || 'master' }}

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust (universal on macOS)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build protocol package
        run: pnpm --filter @runhq/server-protocol build

      - name: Build & publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.event.inputs.version || github.ref_name }}
          releaseName: 'RunHQ ${{ github.event.inputs.version || github.ref_name }}'
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
