name: Desktop Release

# Builds the RunHQ desktop app on FREE public-repo runners by checking out the
# private peonbot/RunHQ source. The private source is only ever pulled into the
# ephemeral runner — it is never committed here.
#
# 3-job structure (the tauri-action matrix pattern) avoids the parallel-publish
# race AND guarantees a single failed platform never ships a partial release:
#   create-release  -> makes a DRAFT release + computes the auto version
#   build (matrix)  -> uploads each OS's installers + latest.json to that draft
#   publish-release -> flips the draft to published, ONLY if all 3 builds passed
#
# Version is auto-derived as 0.1.<run_number> (CI is the single source of truth);
# no manual version bumps, no input to type. Just run the workflow.

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'peonbot/RunHQ ref to build (branch, tag, or SHA)'
        required: false
        default: master

jobs:
  create-release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.mk.outputs.result }}
      app_version: ${{ steps.ver.outputs.version }}
    steps:
      - id: ver
        run: echo "version=0.1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - id: mk
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const version = "0.1.${{ github.run_number }}";
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${version}`,
              name: `RunHQ v${version}`,
              draft: true,
              prerelease: false,
            });
            return data.id;

  build:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Check out private RunHQ source
        uses: actions/checkout@v4
        with:
          repository: peonbot/RunHQ
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          ref: ${{ github.event.inputs.source_ref || 'master' }}

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust (universal on macOS)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build protocol package
        run: pnpm --filter @runhq/server-protocol build

      - name: Write client production env (baked into the bundled webview)
        shell: bash
        run: |
          {
            echo "VITE_CONSOLE_URL=https://console.runhq.io"
            echo "VITE_API_URL=https://console.runhq.io"
            echo "VITE_PREVIEW_DOMAINS=tank.fish"
            echo "VITE_VAPID_PUBLIC_KEY=BP72ICOMQP0N9s56yvRPwE26WplY4N3paKw1Evtt3HrfXd3URcdQ4QrngDBb8Lvk7PIy297oT2IlhhX2vA-1wP0"
          } > client/.env.production
          cat client/.env.production

      - name: Set app version (single source of truth from create-release)
        shell: bash
        run: |
          APP_VERSION="${{ needs.create-release.outputs.app_version }}"
          tmp=$(mktemp)
          # tauri.conf.json version is authoritative for the app + updater version
          jq --arg v "$APP_VERSION" '.version = $v' apps/desktop/src-tauri/tauri.conf.json > "$tmp" && mv "$tmp" apps/desktop/src-tauri/tauri.conf.json
          jq --arg v "$APP_VERSION" '.version = $v' apps/desktop/package.json > "$tmp" && mv "$tmp" apps/desktop/package.json
          echo "App version set to $APP_VERSION"

      - name: Build & upload installers to the draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          releaseId: ${{ needs.create-release.outputs.release_id }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  publish-release:
    needs: [create-release, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false,
            });
