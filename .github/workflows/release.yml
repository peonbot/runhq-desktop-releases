name: Desktop Release

# Builds the RunHQ desktop app on FREE public-repo runners by checking out the
# private peonbot/RunHQ source, then publishes a draft GitHub Release (installers
# + signed latest.json) to THIS public repo. The private source is only ever
# pulled into the ephemeral runner — it is never committed here.

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'peonbot/RunHQ ref to build (branch, tag, or SHA)'
        required: false
        default: master
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Check out private RunHQ source
        uses: actions/checkout@v4
        with:
          repository: peonbot/RunHQ
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          ref: ${{ github.event.inputs.source_ref || 'master' }}

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust (universal on macOS)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build protocol package
        run: pnpm --filter @runhq/server-protocol build

      - name: Write client production env (baked into the bundled webview)
        shell: bash
        run: |
          {
            echo "VITE_CONSOLE_URL=https://console.runhq.io"
            echo "VITE_API_URL=https://console.runhq.io"
            echo "VITE_PREVIEW_DOMAINS=tank.fish"
            echo "VITE_VAPID_PUBLIC_KEY=BP72ICOMQP0N9s56yvRPwE26WplY4N3paKw1Evtt3HrfXd3URcdQ4QrngDBb8Lvk7PIy297oT2IlhhX2vA-1wP0"
          } > client/.env.production
          cat client/.env.production

      - name: Auto-version from build number (CI is the single source of truth)
        shell: bash
        run: |
          APP_VERSION="0.1.${{ github.run_number }}"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          tmp=$(mktemp)
          # tauri.conf.json version is authoritative for the app + updater version
          jq --arg v "$APP_VERSION" '.version = $v' apps/desktop/src-tauri/tauri.conf.json > "$tmp" && mv "$tmp" apps/desktop/src-tauri/tauri.conf.json
          jq --arg v "$APP_VERSION" '.version = $v' apps/desktop/package.json > "$tmp" && mv "$tmp" apps/desktop/package.json
          echo "App version set to $APP_VERSION"

      - name: Build & publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: v${{ env.APP_VERSION }}
          releaseName: 'RunHQ v${{ env.APP_VERSION }}'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
